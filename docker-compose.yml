services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rulesdb
      POSTGRES_USER: rulesuser
      POSTGRES_PASSWORD: devpassword
    ports: ["5432:5432"]
    volumes: ["rules-postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
volumes:
  rules-postgres:
